<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
</head>
<body>
  <h2>Verify Student Ticket</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-messages">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('verify_ticket') }}" method="POST">
    <label>Enter Ticket Token:</label>
    <input type="text" name="token" required><br><br>

    <button type="submit">Verify Ticket</button>
  </form>

  <br>
  <a href="{{ url_for('admin_logout') }}">Logout</a>
</body>
</html>
