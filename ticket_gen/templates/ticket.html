<!DOCTYPE html>
<html>
<head>
  <title>Your Ticket</title>
</head>
<body>
  <h2>Your Ticket</h2>

  <p><strong>Token:</strong> {{ ticket }}</p>
  <p><strong>Expires at:</strong> {{ expiration }}</p>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-messages">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <br>
  <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
