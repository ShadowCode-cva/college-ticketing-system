{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm p-4 text-center">
  <h2>Your Ticket</h2>
  <p><strong>Token:</strong></p>
  <textarea class="form-control" rows="3" readonly>{{ token }}</textarea>
  <p class="mt-2"><strong>Expires at:</strong> {{ expiration }}</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-success mt-3">Back to Dashboard</a>
</div>
{% endblock %}
